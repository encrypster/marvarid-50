<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Test savollarini yodlash: aqlli takrorlash, imtihon rejimi, kartochkalar. Oflayn ishlaydi.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Testlar">
<meta name="app-version" content="__APP_VERSION__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Test trenajyor</title>
<style>
:root{
  --bg:#f3f6f6;--card:#fff;--ink:#12201f;--mute:#5d6f6d;--line:#dbe4e3;
  --acc:#0f766e;--acc-ink:#fff;--acc-soft:#d9f0ec;
  --ok:#15803d;--ok-soft:#dcf5e3;--bad:#b91c1c;--bad-soft:#fde3e3;--warn:#b45309;--warn-soft:#fdefd3;
  --r:16px;--hl:#fde68a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1413;--card:#15211f;--ink:#e8f1ef;--mute:#93a7a4;--line:#263836;
  --acc:#2dd4bf;--acc-ink:#04201c;--acc-soft:#123a35;
  --ok:#4ade80;--ok-soft:#113a22;--bad:#f87171;--bad-soft:#431717;--warn:#fbbf24;--warn-soft:#3d2c08;--hl:#6b4e00;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:640px;margin:0 auto;padding:16px 16px 110px;min-height:100vh}
h1{font-size:24px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:19px;margin:0;line-height:1.35;font-weight:650}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 0 8px;font-weight:600}
p{margin:0}
.mute{color:var(--mute)}.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

/* home */
.hero{display:flex;gap:16px;align-items:center}
.ring{--p:0;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mode:active{transform:scale(.99)}
.mode .ic{width:44px;height:44px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;font-size:22px;flex:none}
.mode b{display:block;font-size:16px}
.mode span{font-size:13px;color:var(--mute)}
.mode.main{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.mode.main span{color:inherit;opacity:.85}
.mode.main .ic{background:rgba(255,255,255,.22)}
.badge{margin-left:auto;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:13px;border-radius:99px;padding:3px 9px;flex:none}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px;flex:none}
.bar{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.cnt{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc);margin-bottom:10px}
.tag.see{background:var(--hl);color:var(--ink)}
mark{background:var(--hl);color:inherit;padding:0 3px;border-radius:4px;font-weight:750}
div.opt{cursor:default}
.opt.big{font-weight:700;font-size:17px;border-width:2.5px}
.why{margin-top:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 13px;font-size:14.5px;line-height:1.45}
.card.aitop{border:2px solid var(--acc);background:var(--acc-soft);margin-bottom:12px}
.card.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.srow{padding:9px 0;border-bottom:1px solid var(--line)}.srow:last-child{border:0}.srow .q{font-weight:600;font-size:15px}.srow .a{color:var(--ok);font-size:14.5px;font-weight:600;margin-top:2px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);margin:0 auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media print{.foot,.x,.toast{display:none!important}#app{padding:0;max-width:none}body{background:#fff}.card,.item{border:0;padding:0}}
.hook{margin-top:12px;background:var(--hl);border-radius:12px;padding:10px 13px;font-size:15px;line-height:1.4}
.item .hook{margin-top:8px;font-size:13.5px;padding:7px 10px}
.deck{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.deck .mode{padding:12px 14px}
.deck.on .mode{border-color:var(--acc);border-width:2px}
.deck .x{align-self:center}
.title{text-align:left;display:block;width:100%}
.tag.again{background:var(--warn-soft);color:var(--warn)}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:52px;transition:border-color .12s,background .12s}
.opt .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);margin-top:1px}
.opt.multi .k{border-radius:7px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .k{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.opt.bad{animation:none}.bar i{transition:none}}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--ink);margin-top:4px;font-size:14px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 30%)}
.foot>div{max-width:608px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;text-align:center}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.no{background:var(--bad-soft);color:var(--bad)}
.btn.yes{background:var(--ok-soft);color:var(--ok)}
.btn.sm{flex:none;padding:9px 14px;font-size:14px;border-radius:11px}
.think{margin-top:14px;text-align:center;padding:22px 16px;border:1.5px dashed var(--line);border-radius:14px}
.reveal{margin-top:14px;display:grid;gap:8px}
.ans{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:11px 14px;font-weight:600}

/* result / browse */
.big{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.item .q{font-weight:600;font-size:15px}
.item .a{color:var(--ok);font-size:14px;margin-top:4px}
.item .w{color:var(--bad);font-size:14px;margin-top:4px;text-decoration:line-through}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--line);vertical-align:1px}
.dot.l{background:var(--warn)}.dot.s{background:var(--ok)}.dot.e{background:var(--bad)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600}
.step input{width:64px;height:38px;text-align:center;font:inherit;font-weight:700;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
input[type=date]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=search]{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input[type=search]:focus{border-color:var(--acc)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
#upd{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--acc);color:var(--acc-ink);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:14.5px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#upd button{background:var(--acc-ink);color:var(--acc);border-radius:9px;padding:6px 12px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"><p class="mute" style="padding:40px 0;text-align:center">Yuklanmoqda…</p></div>
<input type="file" id="file" accept=".txt,text/plain" multiple hidden>
<script>
'use strict';
/* ---------- storage ---------- */
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const DAY=864e5;
const IV=[0,5*6e4,30*6e4,4*36e5,DAY,2*DAY];      // qisqa muddatli tayyorgarlik: 5 daq, 30 daq, 4 soat, 1 kun, 2 kun
const BLOCK=50;
let ALL=[],BYID={},SRC='',BUILTIN=null,BUILTIN_AI=null;
let REPORT={dropped:[],guessed:[],flags:[]},DECKAI={},SECT=[],EX={},SHEET=null;
let DECKS=LS.get('ik_decks',[]);                  // yuklangan testlar: [{id,name,n}]
let P=LS.get('ik_p',{});                          // id -> {b,due,ok,bad,last}
let CFG=Object.assign({size:20,think:false,preview:true,block:0,deck:'builtin',exams:{}},LS.get('ik_cfg',{}));
if(CFG.exam){CFG.exams.builtin=CFG.exam;delete CFG.exam}
let DAYS=LS.get('ik_days',{}),NEWD=LS.get('ik_new',{});
let S=null;                                       // joriy sessiya
let timer=null,deferredInstall=null;
const app=document.getElementById('app');

/* ---------- parser ---------- */
function norm(s){return s.toLowerCase().replace(/[‘’'`ʻʼ´]/g,"'").replace(/\s+/g,' ').trim()}
function hash(s){let a=2166136261,b=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=(Math.imul(b,33)+c)|0}
  return (a>>>0).toString(36)+(b>>>0).toString(36)}
// To‘g‘ri javob FAQAT '+' bilan boshlangan qatordan olinadi. Belgisiz qatorlar taxmin qilinadi va hisobotda ko‘rsatiladi.
function parse(text){
  const out=[],seen={};let cur=null,last='',blank=true;
  const rep={blocks:0,dups:0,orphans:0,dropped:[],guessed:[],flags:[]};
  const fresh=t=>{cur={q:t,opts:[]};out.push(cur);last='q'};
  for(const raw of text.replace(/^﻿/,'').split(/\r?\n/)){
    const s=raw.trim();
    if(!s){blank=true;continue}
    if(s[0]==='#')fresh(s.slice(1).trim());
    else if(s[0]==='+'||s[0]==='-'){
      if(!cur){rep.orphans++;blank=false;continue}
      const two=/^(\+\s*-|-\s*\+)/.test(s);              // "-+ matn": ikki xil belgi — noaniq
      const o={t:s.replace(two?/^[+-]\s*[+-]/:/^[+-]/,'').trim(),c:s[0]==='+'};
      if(two){o.amb=1;o.line=s}
      cur.opts.push(o);last='o'}
    else if(!cur||(cur.opts.length&&blank)){fresh(s);rep.guessed.push({q:cur,line:s,as:'yangi savol deb olindi (# belgisi yo‘q)'})}
    else if(last==='q'){
      if(/[:?]$/.test(s)){cur.q+=' '+s;rep.guessed.push({q:cur,line:s,as:'savol matnining davomi deb olindi'})}
      else{cur.opts.push({t:s,c:false});last='o';rep.guessed.push({q:cur,line:s,as:'NOTO‘G‘RI variant deb olindi (+ yoki - belgisi yo‘q)'})}}
    else{cur.opts[cur.opts.length-1].t+=' '+s;rep.guessed.push({q:cur,line:s,as:'oldingi variantning davomi deb olindi'})}
    blank=false;
  }
  rep.blocks=out.length;
  const res=[],same={};
  const stated=t=>{const m=t.match(/\((\d)\)/)||t.match(/(?:^|\s)(\d)\s*ta(?:\s|$)/);return m&&+m[1]>=2&&+m[1]<=6?+m[1]:0};
  for(const q of out){
    q.opts=q.opts.filter(o=>o.t);
    const amb=q.opts.filter(o=>o.amb),pend=[];
    if(amb.length){                                      // noaniq belgi: savolda aytilgan javoblar soniga qarab hal qilinadi
      const m=stated(q.q),n0=q.opts.filter(o=>o.c).length,nf=n0+amb.reduce((a,o)=>a+(o.c?-1:1),0),flip=m&&n0!==m&&nf===m;
      if(flip)amb.forEach(o=>o.c=!o.c);
      amb.forEach(o=>pend.push({q,line:o.line,as:'ikki xil belgi bilan boshlangan; '+(flip?'savolda '+m+' ta javob so‘ralgani uchun ':'birinchi belgi bo‘yicha ')+(o.c?'TO‘G‘RI':'NOTO‘G‘RI')+' javob deb olindi — manbadan tekshiring'}));
    }
    q.n=q.opts.filter(o=>o.c).length;
    if(!q.q||!q.n||q.opts.length<2){rep.dropped.push({q:q.q,why:!q.n?'to‘g‘ri javob (+) belgilanmagan':'variantlar yetarli emas'});continue}
    const key=o=>norm(o.t);
    q.id=hash(norm(q.q)+'|'+q.opts.filter(o=>o.c).map(key).sort().join('~')+'|'+q.opts.filter(o=>!o.c).map(key).sort().join('~'));
    if(seen[q.id]){rep.dups++;q.dupOf=seen[q.id];continue}seen[q.id]=q;
    q.no=res.length+1;res.push(q);rep.guessed.push(...pend);
    // avtomatik tekshiruvlar
    const m=stated(q.q);
    if(m&&m!==q.n)rep.flags.push({id:q.id,note:'Savolda '+m+' ta javob so‘ralgan, lekin faylda '+q.n+' tasi + bilan belgilangan.'});
    const ks=q.opts.map(key);
    if(new Set(ks).size<ks.length)rep.flags.push({id:q.id,note:'Bir xil variant ikki marta yozilgan'+(q.opts.some(o=>o.c&&q.opts.some(x=>!x.c&&key(x)===key(o)))?' — biri + bilan, biri - bilan!':'.')});
    const sk=norm(q.q)+'|'+ks.slice().sort().join('~');
    if(same[sk])rep.flags.push({id:q.id,o:same[sk].id,note:'Aynan shu savol va variantlar '+same[sk].no+'-savolda boshqa javob bilan belgilangan.'});else same[sk]=q;
  }
  rep.guessed=rep.guessed.map(g=>({line:g.line,as:g.as,id:(g.q.dupOf||g.q).id||null,q:g.q.q}));
  res.report=rep;
  return res;
}
const WORD=/([\p{L}\p{N}'‘’ʻʼ`´-]+)/u;
function words(t){return t.split(WORD).filter((w,i)=>i%2).map(norm).filter(w=>w.length>=4&&!/^[\d-]+$/.test(w))}
// Har bir savolni boshqalaridan ajratib turadigan 1-2 so‘z (ko‘z ilg‘aydigan "langar")
function keywords(qs,ai){
  if(ai)for(const q of qs){                              // AI tahlili bor: langar so‘zlar va ilmoq o‘shandan olinadi
    const a=ai[q.id];if(!a)continue;
    const ks=(a.k||[]).filter(k=>k&&q.q.includes(k)).sort((x,y)=>y.length-x.length);
    if(ks.length){const re=new RegExp('('+ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')');
      q.html=q.q.split(re).map((t,i)=>i%2?'<mark>'+esc(t)+'</mark>':esc(t)).join('')}
    if(a.m)q.m=a.m;
  }
  qs=qs.filter(q=>!q.html);
  const df={};
  for(const q of qs){q._w=[...new Set(words(q.q))];for(const w of q._w)df[w]=(df[w]||0)+1}
  const lim=Math.max(3,qs.length*.03);
  for(const q of qs){
    const kw=q._w.slice().sort((a,b)=>df[a]-df[b]||b.length-a.length).filter((w,i)=>i===0||df[w]<=lim).slice(0,2);
    q.html=q.q.split(WORD).map((t,i)=>i%2&&kw.includes(norm(t))?'<mark>'+esc(t)+'</mark>':esc(t)).join('');
    delete q._w;
  }
}
function setData(text,name,ai){
  const qs=parse(text);
  if(!qs.length)return false;
  keywords(qs,ai);
  ALL=qs;BYID={};qs.forEach(q=>BYID[q.id]=q);SRC=name;REPORT=qs.report;
  DECKAI=(ai&&ai._deck)||{};
  // bo‘limlar: AI mavzulari bo‘lsa — mavzular, bo‘lmasa 50 talik bloklar
  SECT=[];
  if(DECKAI.topics&&DECKAI.topics.length){
    const used=new Set();
    for(const t of DECKAI.topics){const l=t.ids.map(id=>BYID[id]).filter(q=>q&&!used.has(q.id)&&used.add(q.id));if(l.length)SECT.push({name:t.name,qs:l,topic:true})}
    const rest=ALL.filter(q=>!used.has(q.id));if(rest.length)SECT.push({name:'Boshqa',qs:rest,topic:true});
  }else for(let i=0;i<ALL.length;i+=BLOCK)SECT.push({name:(i+1)+'–'+Math.min(i+BLOCK,ALL.length),qs:ALL.slice(i,i+BLOCK)});
  if(CFG.block>SECT.length)CFG.block=0;
  EX=LS.get('ik_ex_'+CFG.deck,{})||{};SHEET=null;
  return true;
}
function examDate(){return CFG.exams[CFG.deck]||''}
async function loadDeck(id){
  if(id!=='builtin'){
    const d=DECKS.find(d=>d.id===id),t=d&&LS.get('ik_deck_'+id,null);
    const prev=CFG.deck;CFG.deck=id;
    if(t&&setData(t,d.name,LS.get('ik_ai_'+id,null))){saveCfg();return true}
    CFG.deck=prev;
  }
  if(BUILTIN==null){try{const r=await fetch('questions.txt');if(r.ok)BUILTIN=await r.text()}catch(e){}
    try{const r=await fetch('questions.ai.json');if(r.ok)BUILTIN_AI=await r.json()}catch(e){}}
  const prev=CFG.deck;CFG.deck='builtin';
  if(BUILTIN&&setData(BUILTIN,'IK-509',BUILTIN_AI)){saveCfg();return true}
  CFG.deck=prev;
  return false;
}
function addDeck(name,text){
  const qs=parse(text);if(!qs.length)return null;
  name=name.replace(/\.txt$/i,'');
  let d=DECKS.find(d=>d.name===name);                 // shu nomli fayl qayta yuklansa — yangilanadi
  const id=d?d.id:'d'+Date.now().toString(36)+(Math.random()*1e4|0);
  if(!LS.set('ik_deck_'+id,text))return false;
  if(d)d.n=qs.length;else DECKS.push(d={id,name,n:qs.length});
  LS.set('ik_decks',DECKS);return d;
}
function decode(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder('utf-16le').decode(buf);
  if(b[0]===0xFE&&b[1]===0xFF)return new TextDecoder('utf-16be').decode(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1251').decode(buf)}
}

  const old=LS.get('ik_custom',null);

const keyHtml=q=>q.opts.filter(o=>o.c).map(o=>'<div class="a">✓ '+esc(o.t)+'</div>').join('');

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function range(){                                    // tartib raqami bo‘yicha oraliq: [a,b] yoki null (hammasi)

  const a=Math.max(1,Math.min(ALL.length,r.a|0||1)),b=Math.max(a,Math.min(ALL.length,r.b|0||ALL.length));

}
function setRange(a,b){
  CFG.range=CFG.range||{};

  if(a===1&&b===ALL.length)delete CFG.range[CFG.deck];else CFG.range[CFG.deck]={a,b};
  saveCfg();
}
function pool(){

function status(id){const p=P[id];return !p?'n':p.b<=1?'e':p.b===2?'l':'s'}

function grade(id,ok){
  const now=Date.now(),p=P[id]||{b:0,ok:0,bad:0},k=dayKey();

}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return dayKey(d)}
function plan(){
  if(!examDate())return null;
  const d=Math.round((new Date(examDate()+'T00:00')-new Date(dayKey()+'T00:00'))/DAY);
  if(d<0)return null;

  const target=Math.ceil((fresh+nt)/Math.max(1,d-1));          // oxirgi kun faqat takrorlash uchun
  return {d,fresh,nt,target,newLeft:Math.max(0,Math.min(fresh,target-nt)),due:ALL.filter(q=>P[q.id]&&P[q.id].due<=now).length};
}

/* ---------- session building ---------- */
function pickLearn(n){
  const now=Date.now(),pl=pool();
  const byBox=(a,b)=>P[a.id].b-P[b.id].b||P[a.id].due-P[b.id].due;
  const due=pl.filter(q=>P[q.id]&&P[q.id].due<=now).sort(byBox);
  const fresh=pl.filter(q=>!P[q.id]);
  const later=pl.filter(q=>P[q.id]&&P[q.id].due>now).sort(byBox);
  const out=due.slice(0,Math.ceil(n*.6));
  for(const src of [fresh,due,later])for(const q of src){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
  // takrorlanadiganlar aralash, yangi savollar esa fayldagi tartibda (1, 2, 3 …)
  return shuffle(out.filter(q=>P[q.id])).concat(out.filter(q=>!P[q.id]).sort((a,b)=>a.no-b.no)).map(q=>q.id);
}
function withPreview(ids){                        // yangi savol avval ko‘rsatiladi, 3 ta kartadan keyin so‘raladi
  if(!CFG.preview)return ids;
  const q=[],pend=[];
  for(const id of ids){
    if(!P[id]){q.push('v:'+id);pend.push({id,n:4})}else q.push(id);
    for(let i=0;i<pend.length;i++)if(--pend[i].n<=0){q.push(pend[i].id);pend.splice(i--,1)}
  }
  return q.concat(pend.map(x=>x.id));
}
function start(mode,ids,extra){
  stopTimer();
  if(!ids.length){toast('Bu rejim uchun savol yo‘q');return}
  S=Object.assign({mode,queue:ids.slice(),pos:0,total:mode==='view'?ids.length:ids.filter(x=>x[1]!==':').length,done:0,first:{},conf:{},missed:[],answers:{},cur:null},extra||{});
  if(mode==='exam'){
    S.left=S.left||ids.length*60;
    timer=setInterval(()=>{S.left--;const t=document.getElementById('timer');if(t)t.textContent=fmt(Math.max(S.left,0));if(S.left<=0)finish()},1000);
  }
  nextQ();
}
function nextQ(){
  if(S.pos>=S.queue.length)return finish();
  const it=S.queue[S.pos],v=it[1]===':',q=BYID[v?it.slice(2):it];
  S.cur={q,view:v,order:shuffle(q.opts.map((_,i)=>i)),sel:[],answered:false,shown:!(CFG.think&&S.mode==='learn'),revealed:false,repeat:S.first[q.id]!==undefined};
  if(S.mode==='exam'&&S.answers[q.id])S.cur.sel=S.answers[q.id].slice();
  renderQ();
}
function isRight(q,sel){return sel.length===q.n&&sel.every(i=>q.opts[i].c)}

function answer(){
  const c=S.cur,q=c.q;c.answered=true;c.right=isRight(q,c.sel);
  if(S.first[q.id]===undefined){S.first[q.id]=c.right;grade(q.id,c.right);if(!c.right)S.missed.push({id:q.id,sel:c.sel.slice()})}
  if(c.right){if(S.first[q.id]===false&&!S.conf[q.id]&&S.mode!=='exam'){S.conf[q.id]=1;S.queue.push(q.id)}else S.done++}
  else{S.conf[q.id]=0;S.queue.splice(Math.min(S.queue.length,S.pos+3),0,q.id);if(navigator.vibrate)navigator.vibrate(60)}
  renderQ();
}
function finish(){
  stopTimer();if(!S)return home();
  if(S.mode==='view'){toast('Ko‘rib chiqish tugadi');return home()}
  let right,total=S.total,missed;
  if(S.mode==='exam'){

    for(const id of S.queue){const sel=S.answers[id]||[],ok=isRight(BYID[id],sel);grade(id,ok);if(ok)right++;else missed.push({id,sel})}
  }else{missed=S.missed;right=total-missed.length}
  const pct=Math.round(right/total*100),ids=missed.map(m=>m.id);
  let byType='';
  if(S.mode==='exam'){const t={},bad=new Set(ids);
    for(const id of S.queue){const n=BYID[id].n;t[n]=t[n]||[0,0];t[n][1]++;if(!bad.has(id))t[n][0]++}
    byType='<div class="stats" style="grid-template-columns:repeat('+Object.keys(t).length+',1fr)">'+Object.keys(t).sort((a,b)=>a-b).map(n=>'<div class="stat"><b>'+t[n][0]+' / '+t[n][1]+'</b><span>'+n+' javobli</span></div>').join('')+'</div>'}
  const title={learn:'Sessiya yakunlandi',errors:'Xatolar ustida ishlash yakunlandi',cards:'Kartochkalar yakunlandi',exam:'Imtihon natijasi'}[S.mode];
  const col=pct>=86?'var(--ok)':pct>=56?'var(--warn)':'var(--bad)';
  let h=`<div class="card" style="text-align:center;margin-top:8px"><p class="mute">${title}</p>
    <div class="big" style="color:${col};margin:10px 0 6px">${pct}%</div>
    <p><b>${right}</b> / ${total} ${S.mode==='exam'?'to‘g‘ri':'birinchi urinishda to‘g‘ri'}</p>${byType}</div>`;
  if(missed.length){
    h+='<h3>Eslab qolish kerak ('+missed.length+')</h3>';
    for(const m of missed){const q=BYID[m.id];
      h+='<div class="item"><div class="q">'+q.html+'</div>'+
        q.opts.filter(o=>o.c).map(o=>'<div class="a">✓ '+esc(o.t)+'</div>').join('')+
        (m.sel||[]).filter(i=>!q.opts[i].c).map(i=>'<div class="w">'+esc(q.opts[i].t)+'</div>').join('')+hook(q)+'</div>'}

function examCfg(){                                 // imtihon tarkibi: har bir tur (to‘g‘ri javoblar soni) bo‘yicha nechta savol
  const have={};pool().forEach(q=>have[q.n]=(have[q.n]||0)+1);
  const key=CFG.deck+'|'+CFG.block;CFG.examCfg=CFG.examCfg||{};
  let c=CFG.examCfg[key];
  if(!c){const n=pool().length,tot=Math.min(50,n);c={counts:{},min:0,order:'mix'};
    for(const k in have)c.counts[k]=Math.round(have[k]/n*tot);
    c.min=Object.values(c.counts).reduce((a,b)=>a+b,0);CFG.examCfg[key]=c}
  for(const k in c.counts)if(!have[k])delete c.counts[k];
  for(const k in have)c.counts[k]=Math.max(0,Math.min(have[k],c.counts[k]|0));
  return {have,c,total:Object.values(c.counts).reduce((a,b)=>a+b,0)};
}

  ai_auth:'AI kaliti ishlamayapti yoki kredit tugagan.',refused:'AI bu so‘rovni bajarishdan bosh tortdi.',too_large:'Test juda katta.',too_long:'AI javobi sig‘madi — qayta urinib ko‘ring.'};

async function api(path,body){                      // muvaffaqiyatsiz bo‘lsa o‘zbekcha xabar bilan xato tashlaydi
  const code=getCode();if(!code)throw new Error('Kirish kodi kiritilmadi.');
  let resp,data;
  try{resp=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-access-code':code},body:JSON.stringify(body)});data=JSON.parse(await resp.text())}

}

const DECKTASK={topics:['Mavzularga ajratish',aiTools],pairs:['O‘xshash savollarni topish',pairsView],audit:['Javob kalitini tekshirish',check]};
async function deckAi(task,chain){
  if(CFG.deck==='builtin')return toast('IK-509 uchun bu tahlil allaqachon biriktirilgan');
  const deck=CFG.deck,[title,after]=DECKTASK[task];
  if(!getCode())return;
  busy('✨ '+title,'AI butun testni o‘qiyapti. Bu 1–3 daqiqa oladi — sahifani yopmang.');
  try{
    const data=await api('api/deck',{task,questions:ALL.map(q=>({n:q.no,q:q.q,ok:q.opts.filter(o=>o.c).map(o=>o.t),bad:task==='topics'?undefined:q.opts.filter(o=>!o.c).map(o=>o.t)}))});
    const id=n=>ALL[n-1]&&ALL[n-1].id,ai=LS.get('ik_ai_'+deck,{})||{},d=ai._deck=ai._deck||{};
    if(task==='topics')d.topics=data.topics.map(t=>({name:t.name,ids:t.nos.map(id).filter(Boolean)}));
    if(task==='pairs')d.pairs=data.pairs.map(p=>({a:id(p.a),b:id(p.b),d:p.d}));
    if(task==='audit')d.issues=data.issues.map(i=>({id:id(i.n),o:i.o?id(i.o):0,kind:i.kind,note:i.note}));
    if(!LS.set('ik_ai_'+deck,ai))throw new Error('Qurilma xotirasi to‘ldi.');
    if(task==='topics'){CFG.block=0;saveCfg()}
    if(CFG.deck===deck)await loadDeck(deck);
    if(chain)return true;
    toast('Tayyor ✨');after();

  <div class="foot"><div><button class="btn ghost" data-act="aistop">${r.stopped?'Bosh sahifa':'To‘xtatish'}</button></div></div>`);

async function aiRun(chain){
  let code=LS.get('ik_code','');
  if(!code){code=(prompt('AI tahlili uchun kirish kodini kiriting:')||'').trim();if(!code)return}
  const deck=CFG.deck,todo=aiMissing(),ai=LS.get('ik_ai_'+deck,{})||{};
  const r=AIRUN={done:0,total:todo.length,stopped:false,msg:''};aiView();
  const ERR={bad_code:'Kirish kodi noto‘g‘ri.',rate_limited:'AI band — birozdan keyin qayta urinib ko‘ring.',not_configured:'AI server sozlanmagan.',
    ai_auth:'AI kaliti ishlamayapti yoki kredit tugagan.',refused:'AI bu savollarni tahlil qilishdan bosh tortdi.'};
  for(let i=0;i<todo.length&&!r.stopped;i+=15){
    const part=todo.slice(i,i+15);let res=null,err='';
    for(let t=0;t<2&&!res&&!r.stopped;t++){                 // bir marta qayta urinish
      try{
        const resp=await fetch('api/analyze',{method:'POST',headers:{'content-type':'application/json','x-access-code':code},
          body:JSON.stringify({questions:part.map(q=>({id:q.id,q:q.q,ok:q.opts.filter(o=>o.c).map(o=>o.t),bad:q.opts.filter(o=>!o.c).map(o=>o.t)}))})});
        const data=await resp.json().catch(()=>({}));
        if(resp.ok&&data.items)res=data.items;
        else{err=ERR[data.error]||'AI serverda xato ('+resp.status+').';if(resp.status===401){LS.del('ik_code');break}if(resp.status<500&&resp.status!==429)break}
      }catch(e){err='AI serverga ulanib bo‘lmadi. Internetni tekshiring.'}
    }
    if(r.stopped)break;
    if(!res){r.stopped=true;r.msg=err+' Tayyor bo‘lgan qismi saqlandi.';break}
    LS.set('ik_code',code);
    Object.assign(ai,res);
    if(!LS.set('ik_ai_'+deck,ai)){r.stopped=true;r.msg='Qurilma xotirasi to‘ldi.';break}
    r.done+=part.length;if(AIRUN===r)aiView();
  }
  if(CFG.deck===deck)await loadDeck(deck);
  if(AIRUN!==r)return;
  if(r.stopped&&r.msg)return aiView();
  AIRUN=null;if(chain&&!r.stopped)return true;
  toast(r.stopped?'Tahlil to‘xtatildi':'AI tahlili tayyor ✨');home();
}

  show(`<div class="qhead"><button class="x" data-act="home">←</button><h2>Sozlamalar</h2></div>
  <div class="card">
    <div class="set"><div><b>Sessiya hajmi</b><p class="mute small">Aqlli o‘rganishdagi savollar soni</p></div>
      <div class="seg">${[10,20,30].map(n=>`<button class="${CFG.size===n?'on':''}" data-act="size" data-v="${n}">${n}</button>`).join('')}</div></div>
    <div class="set"><div><b>Yangi savolni avval ko‘rsatish</b><p class="mute small">Savol to‘g‘ri javobi bilan ko‘rsatiladi, keyin so‘raladi</p></div>
      <div class="seg"><button class="${CFG.preview?'':'on'}" data-act="preview" data-v="0">Yo‘q</button><button class="${CFG.preview?'on':''}" data-act="preview" data-v="1">Ha</button></div></div>
    <div class="set"><div><b>Avval o‘ylab ko‘rish</b><p class="mute small">Variantlar yashirin turadi — javobni o‘zingiz eslaysiz</p></div>
      <div class="seg"><button class="${CFG.think?'':'on'}" data-act="think" data-v="0">Yo‘q</button><button class="${CFG.think?'on':''}" data-act="think" data-v="1">Ha</button></div></div>
  </div>
  <h3>Test kuni</h3>
  <div class="card"><div class="set"><div><b>Sana</b><p class="mute small">Kunlik reja shu sanaga qarab hisoblanadi</p></div>
    <input type="date" id="exam" value="${esc(examDate())}" min="${dayKey()}"></div></div>
  <h3>Testlar</h3>
  <div class="card"><p><b>${esc(SRC)}</b> — ${ALL.length} ta savol</p><p class="mute small" style="margin:4px 0 12px">Test kuni har bir test uchun alohida saqlanadi.</p>
    <button class="btn sm" data-act="decks">Testlar ro‘yxati va fayl yuklash</button></div>
  <h3>Natijalar</h3>
  <div class="card"><p class="mute small" style="margin-bottom:12px">Natijalar faqat shu qurilmada saqlanadi.</p><button class="btn sm no" data-act="reset">Natijalarni o‘chirish</button></div>`);
}

/* ---------- events ---------- */
const ACT={
  home,settings,browse,decks,examsetup:examSetup,
  async deck(v){await loadDeck(v);CFG.block=0;saveCfg();home()},
  async deldeck(v){
    const d=DECKS.find(d=>d.id===v);if(!d||!confirm('«'+d.name+'» o‘chirilsinmi?'))return;
    DECKS=DECKS.filter(x=>x.id!==v);LS.set('ik_decks',DECKS);LS.del('ik_deck_'+v);LS.del('ik_ai_'+v);LS.del('ik_ex_'+v);delete CFG.exams[v];saveCfg();
    if(CFG.deck===v)await loadDeck('builtin');decks()},
  view(){const pl=pool(),weak=pl.filter(q=>status(q.id)!=='s');start('view',(weak.length?weak:pl).map(q=>'v:'+q.id))},
  auto(){if(timer)stopTimer();else timer=setInterval(()=>{if(S&&S.mode==='view')ACT.next();else stopTimer()},5000);renderQ()},
  preview(v){CFG.preview=v==='1';saveCfg();settings()},
  ai(){aiRun()},
  filecheck:check,aitools:aiTools,pairs:pairsView,sheet:sheetView,
  deckai(v){deckAi(v)},
  rstep(v){const r=range()||{a:1,b:ALL.length};setRange(r.a,Math.max(r.a,r.b+ +v));home()},
  rall(){setRange(1,ALL.length);home()},
  aiall(){aiAll()},
  print(){window.print()},
  async explain(v){
    const q=BYID[v];if(!q||EX[v])return;
    if(!getCode())return;
    const redraw=()=>{if(S&&S.cur&&S.cur.q.id===v)renderQ()};
    EX[v]=1;redraw();
    try{const d=await api('api/explain',{q:q.q,ok:q.opts.filter(o=>o.c).map(o=>o.t),bad:q.opts.filter(o=>!o.c).map(o=>o.t)});
      EX[v]={t:d.text,d:d.doubt?1:0};const keep={};for(const k in EX)if(EX[k]!==1)keep[k]=EX[k];LS.set('ik_ex_'+CFG.deck,keep)}
    catch(e){delete EX[v];toast(e.message)}
    redraw()},
  async sheetai(){
    const worst=pool().filter(q=>P[q.id]&&P[q.id].bad>0).sort((a,b)=>P[b.id].bad-P[a.id].bad||P[a.id].b-P[b.id].b).slice(0,40);
    if(!worst.length||!getCode())return;
    busy('✨ Shpargalka','AI savollarni mavzular bo‘yicha guruhlayapti…');
    try{const d=await api('api/sheet',{questions:worst.map(q=>({n:q.no,q:q.q,ok:q.opts.filter(o=>o.c).map(o=>o.t)}))});
      const used=new Set(),sections=d.sections.map(s=>({title:s.title,rows:s.rows.map(r=>({id:ALL[r.n-1].id,cue:r.cue})).filter(r=>used.add(r.id))}));
      const rest=worst.filter(q=>!used.has(q.id));if(rest.length)sections.push({title:'Boshqa',rows:rest.map(q=>({id:q.id,cue:''}))});
      SHEET={key:worst.map(q=>q.id).join(),sections}}
    catch(e){toast(e.message)}
    sheetView()},
  aistop(){if(AIRUN){if(AIRUN.stopped){AIRUN=null;home()}else{AIRUN.stopped=true;AIRUN.msg='To‘xtatilmoqda…';aiView()}}},
  block(v){CFG.block=+v;saveCfg();home()},
  learn(){start('learn',withPreview(pickLearn(CFG.size)))},
  errors(){start('errors',shuffle(pool().filter(q=>status(q.id)==='e')).slice(0,30).map(q=>q.id))},
  cards(){start('cards',pickLearn(CFG.size))},
  exam(){
    const {c}=examCfg(),pl=pool();let ids=[];
    for(const k of Object.keys(c.counts).sort((a,b)=>a-b))ids=ids.concat(shuffle(pl.filter(q=>q.n===+k)).slice(0,c.counts[k]).map(q=>q.id));
    start('exam',c.order==='mix'?shuffle(ids):ids,{left:c.min*60})},
  exstep(v,b){const {c}=examCfg(),k=b.dataset.k;exSet(k,(k==='min'?c.min:c.counts[k])+ +v);examSetup()},
  exorder(v){examCfg().c.order=v;saveCfg();examSetup()},
  retry(){start('errors',shuffle(S.retry))},
  quit(){if(S.mode==='exam'){if(confirm('Imtihonni yakunlab, natijani ko‘rasizmi?'))finish()}else if(S.mode==='view'||!S.pos&&!S.cur.answered||confirm('Sessiyadan chiqasizmi?'))home()},
  showopts(){S.cur.shown=true;renderQ()},
  opt(v){
    const c=S.cur,i=+v;if(c.answered)return;
    if(c.q.n===1){c.sel=[i];if(S.mode==='exam')renderQ();else answer()}
    else{const k=c.sel.indexOf(i);if(k>=0)c.sel.splice(k,1);else if(c.sel.length<c.q.n)c.sel.push(i);else return toast('Faqat '+c.q.n+' ta javob tanlanadi');renderQ()}
  },
  check(){if(S.cur.sel.length===S.cur.q.n)answer()},
  next(){S.pos++;nextQ()},
  examnext(){S.answers[S.cur.q.id]=S.cur.sel.slice();S.pos++;nextQ()},
  prev(){S.answers[S.cur.q.id]=S.cur.sel.slice();S.pos--;nextQ()},
  reveal(){S.cur.revealed=true;renderQ()},
  rate(v){const ok=v==='1',id=S.cur.q.id;
    if(S.first[id]===undefined){S.first[id]=ok;grade(id,ok);if(!ok)S.missed.push({id,sel:[]})}
    if(!ok)S.queue.splice(Math.min(S.queue.length,S.pos+4),0,id),S.total=S.queue.length;
    S.pos++;nextQ()},
  bf(v){BF.f=v;browse()},
  examday(v){CFG.exams[CFG.deck]=addDays(+v);saveCfg();home()},
  size(v){CFG.size=+v;saveCfg();settings()},
  think(v){CFG.think=v==='1';saveCfg();settings()},
  upload(){document.getElementById('file').click()},
  reset(){if(confirm('Barcha natijalar o‘chirilsinmi?')){P={};DAYS={};NEWD={};LS.set('ik_p',P);LS.set('ik_days',DAYS);LS.set('ik_new',NEWD);toast('Natijalar o‘chirildi');home()}},
  async install(){if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;home()}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset.v!==undefined?b.dataset.v:b.dataset.i,b)});
app.addEventListener('change',e=>{if(e.target.classList.contains('rng')){const r=range()||{a:1,b:ALL.length};r[e.target.dataset.k]=+e.target.value||0;if(e.target.dataset.k==='a'&&r.a>r.b)r.b=r.a;if(e.target.dataset.k==='b'&&r.b<r.a)r.a=1;setRange(r.a,r.b);return home()}if(e.target.classList.contains('exn')){exSet(e.target.dataset.k,+e.target.value);return examSetup()}if(e.target.id==='exam'){CFG.exams[CFG.deck]=e.target.value||'';saveCfg();toast('Test kuni saqlandi')}});
document.addEventListener('keydown',e=>{
  if(!S||!S.cur||e.target.tagName==='INPUT')return;
  if(e.key==='Enter'){const b=app.querySelector('.foot .btn:last-child:not([disabled])');if(b)b.click()}
  else if(/^[1-9]$/.test(e.key)){const b=app.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
});
document.getElementById('file').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  let last=null,bad=0,full=false;
  for(const f of files){
    const d=addDeck(f.name,decode(await f.arrayBuffer()));
    if(d)last=d;else if(d===false)full=true;else bad++;
  }
  if(full)toast('Qurilma xotirasi to‘ldi — eski testlardan birini o‘chiring');
  else if(bad)toast(bad+' ta faylda savol topilmadi. Format: # savol, + to‘g‘ri, - noto‘g‘ri');
  if(last){await loadDeck(last.id);CFG.block=0;saveCfg();if(!bad&&!full)toast('«'+last.name+'»: '+ALL.length+' ta savol yuklandi');home()}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(!S)home()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;if(!S)home()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- avtomatik yangilanish ---------- */
// Sahifaga joylashtirish paytida versiya yoziladi; serverdagi version.json undan farq qilsa — yangi versiya chiqqan.
const APPV=(document.querySelector('meta[name=app-version]')||{}).content||'';
let NEWV='',lastCheck=0;
function applyUpdate(){
  try{sessionStorage.setItem('ik_upd',NEWV)}catch(e){}
  const go=()=>location.reload();
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}).then(go);else go();
}
function updateBar(){
  if(document.getElementById('upd'))return;
  const d=document.createElement('div');d.id='upd';
  d.innerHTML='<span>🔄 Ilovaning yangi versiyasi chiqdi</span><button>Yangilash</button>';
  d.querySelector('button').onclick=applyUpdate;document.body.appendChild(d);
}
function updateReady(){                              // mashq o‘rtasida bo‘lmasa o‘zi yangilanadi, aks holda yozuv chiqadi
  if(!NEWV)return;
  let tried='';try{tried=sessionStorage.getItem('ik_upd')||''}catch(e){}
  if(!S&&!AIRUN&&tried!==NEWV&&!document.querySelector('.spin')){toast('Yangi versiya o‘rnatilmoqda…');setTimeout(applyUpdate,900)}
  else updateBar();
}
async function checkUpdate(){
  if(!APPV||APPV[0]==='_'||NEWV||Date.now()-lastCheck<60000)return;
  lastCheck=Date.now();
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=(await r.json()).v;if(v&&v!==APPV){NEWV=v;updateReady()}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
window.addEventListener('online',checkUpdate);
setInterval(checkUpdate,15*60000);setTimeout(checkUpdate,4000);
boot();
</script>
