<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ishonchli Shartnoma</title>
<meta name="description" content="Yangi uy shartnomasini imzolashdan oldin tekshiring">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #F5F3EE; --surface: #FFFFFF; --sunken: #F0EDE5; --ink: #0E1C19; --muted: #5C6965; --faint: #8A9591;
  --line: #E6E1D6; --line-strong: #D6D0C2;
  --brand: #0A5C4C; --brand-2: #0F7A64; --brand-soft: #E3F1ED; --on-brand: #FFFFFF;
  --hero-a: #083F35; --hero-b: #0F7A64; --on-hero: #FFFFFF; --on-hero-muted: rgba(255,255,255,.74);
  --danger: #B4382A; --danger-soft: #FBEBE7; --warn: #96610F; --warn-soft: #FBF2DE;
  --ok: #24704A; --ok-soft: #E3F2E8;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --shadow: 0 1px 2px rgba(14,28,25,.05), 0 8px 24px rgba(14,28,25,.06);
  --nav-h: 64px;
}
:root[data-theme="dark"] {
  --bg: #0C1412; --surface: #141E1B; --sunken: #101916; --ink: #E9EFEC; --muted: #94A29D; --faint: #6F7D78;
  --line: #24312C; --line-strong: #31403A;
  --brand: #3CC7A6; --brand-2: #2FA88C; --brand-soft: #173029; --on-brand: #05211B;
  --hero-a: #0B2A24; --hero-b: #125848; --on-hero: #F2F7F5; --on-hero-muted: rgba(242,247,245,.7);
  --danger: #F08A78; --danger-soft: #34201C; --warn: #E6B45F; --warn-soft: #332A16;
  --ok: #6FCF97; --ok-soft: #183023;
  --shadow: 0 0 0 1px var(--line);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
}
main { max-width: 640px; margin: 0 auto; padding: 0 16px 16px; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--brand); text-decoration: none; font-weight: 600; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.icon { display: inline-flex; flex: none; }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Sarlavha */
.top { display: flex; align-items: center; gap: 10px; padding: 14px 2px 12px; }
.logo { width: 34px; height: 34px; flex: none; }
.brand-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.top .spacer { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 650; }
.badge .icon { width: 14px; height: 14px; }

.stack > * + * { margin-top: 12px; }
.stack-lg > * + * { margin-top: 20px; }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 4px 10px; }
.section-head h2 { font-size: 18px; letter-spacing: -.01em; }
.section-head span { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; line-height: 1.45; }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 22px 20px; color: var(--on-hero);
  background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.14), transparent 55%), linear-gradient(145deg, var(--hero-a), var(--hero-b)); }
.hero h1 { font-size: 26px; line-height: 1.18; letter-spacing: -.025em; font-weight: 750; max-width: 15em; }
.hero p { margin-top: 10px; font-size: 15px; color: var(--on-hero-muted); max-width: 30em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.14); font-size: 12.5px; font-weight: 600; color: var(--on-hero); }
.chip .icon { width: 14px; height: 14px; }

/* Yuklash */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--sunken); }
.seg button { border: 0; background: none; min-height: 36px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14,28,25,.12); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--line-strong); box-shadow: none; }
.seg .count { font-variant-numeric: tabular-nums; font-size: 12px; padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--muted); }
.seg button[aria-pressed="true"] .count { background: var(--brand-soft); color: var(--brand); }
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); padding: 24px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
.drop:active { background: var(--sunken); }
.drop input { display: none; }
.drop .bubble { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin-bottom: 4px; }
.drop .bubble .icon { width: 24px; height: 24px; }
.drop strong { font-size: 16px; }
.drop span { font-size: 13px; color: var(--muted); }
.file { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; }
.file .bubble { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.file .bubble .icon { width: 22px; height: 22px; }
.file .meta { flex: 1; min-width: 0; }
.file .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--sunken); color: var(--muted); display: grid; place-items: center; flex: none; }
.icon-btn .icon { width: 18px; height: 18px; }
textarea { display: block; width: 100%; min-height: 170px; resize: vertical; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); padding: 12px 14px; font: inherit; font-size: 15px; line-height: 1.45; }
textarea::placeholder { color: var(--faint); }
textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: transparent; }
.counter { text-align: right; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border: 0; border-radius: var(--r-md); background: var(--brand); color: var(--on-brand); font-weight: 650; font-size: 16px; padding: 0 18px; transition: transform .08s, opacity .15s; }
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn .icon { width: 20px; height: 20px; }
.btn.secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.quiet { background: none; color: var(--brand); min-height: 44px; font-size: 15px; }
.btn.compact { width: auto; min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; background: var(--surface); color: var(--brand); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.compact .icon { width: 15px; height: 15px; }

.alert { display: flex; gap: 10px; border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; line-height: 1.4; background: var(--danger-soft); color: var(--danger); }
.alert .icon { width: 18px; height: 18px; margin-top: 1px; }

/* Qadamlar */
.how li { display: flex; gap: 12px; align-items: flex-start; }
.how li + li { margin-top: 14px; }
.how .num { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.how b { display: block; font-size: 15px; }
.how span { font-size: 13.5px; color: var(--muted); }

/* Yuklanish */
.progress { padding: 26px 20px; }
.progress h2 { font-size: 20px; letter-spacing: -.015em; }
.bar { height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; margin: 16px 0 18px; }
.bar i { display: block; height: 100%; width: 35%; border-radius: inherit; background: var(--brand); animation: slide 1.5s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
.stages li { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--faint); padding: 7px 0; }
.stages li .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; display: grid; place-items: center; }
.stages li.active { color: var(--ink); font-weight: 600; }
.stages li.active .dot { border-color: var(--brand); border-top-color: transparent; animation: spin .8s linear infinite; }
.stages li.done { color: var(--muted); }
.stages li.done .dot { border-color: var(--ok); background: var(--ok); color: var(--surface); }
.stages li.done .dot .icon { width: 12px; height: 12px; }
.stages li.done .dot .icon svg { stroke-width: 3; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .bar i, .stages li.active .dot { animation-duration: 4s; } }

/* Natija */
.verdict { display: flex; align-items: center; gap: 16px; }
.gauge { position: relative; width: 92px; height: 92px; flex: none; }
.gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge circle { fill: none; stroke-width: 9; }
.gauge .track { stroke: var(--sunken); }
.gauge .value { stroke: var(--tone); stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.gauge .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1; }
.gauge .num b { font-size: 28px; font-weight: 750; letter-spacing: -.03em; color: var(--tone); font-variant-numeric: tabular-nums; }
.gauge .num span { font-size: 11px; color: var(--muted); margin-top: 3px; }
.verdict h2 { font-size: 21px; line-height: 1.2; letter-spacing: -.02em; }
.verdict .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tone); margin-bottom: 4px; }
.tone-high { --tone: var(--danger); } .tone-mid { --tone: var(--warn); } .tone-ok { --tone: var(--ok); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
.stats div { text-align: center; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.stats .bad b { color: var(--danger); } .stats .unclear b { color: var(--warn); } .stats .good b { color: var(--ok); }
.summary { margin-top: 14px; font-size: 15px; color: var(--muted); }
.sticky-seg { position: sticky; top: 0; z-index: 3; margin: 16px -16px 0; padding: 8px 16px; background: var(--bg); }

/* Band kartasi */
details.item { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
details.item > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
details.item > summary::-webkit-details-marker { display: none; }
.sev { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--tone-soft); color: var(--tone); }
.sev .icon { width: 19px; height: 19px; }
.sev-yuqori, .kind-xavf { --tone: var(--danger); --tone-soft: var(--danger-soft); }
.sev-orta, .sev-past, .sev-unclear { --tone: var(--warn); --tone-soft: var(--warn-soft); }
.sev-good, .kind-imkoniyat { --tone: var(--ok); --tone-soft: var(--ok-soft); }
.item .head { flex: 1; min-width: 0; }
.item .head .label { font-size: 12px; font-weight: 650; color: var(--tone); }
.item .head .name { font-size: 15.5px; font-weight: 650; line-height: 1.3; }
.item.reading .head .name { font-weight: 500; line-height: 1.4; margin-top: 2px; }
.chev { width: 20px; height: 20px; color: var(--faint); transition: transform .2s; }
details[open] > summary .chev { transform: rotate(180deg); }
.item .body { padding: 0 16px 16px; }
.item .body > * + * { margin-top: 12px; }
blockquote { margin: 0; padding: 12px 14px; background: var(--sunken); border-radius: var(--r-sm); font-size: 14px; line-height: 1.5; border-left: 3px solid var(--tone, var(--line-strong)); white-space: pre-line; overflow-wrap: anywhere; }
.field .eyebrow { margin-bottom: 3px; }
.field p { font-size: 15px; }
.ask { background: var(--brand-soft); border-radius: var(--r-md); padding: 12px 14px; }
.ask .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.ask .eyebrow { color: var(--brand); }
.ask p { font-size: 15px; font-weight: 550; }
.fact { display: flex; gap: 8px; font-size: 13px; color: var(--muted); }
.fact .icon { width: 16px; height: 16px; margin-top: 1px; color: var(--faint); }
details.sub { border-top: 1px solid var(--line); padding-top: 12px; }
details.sub > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 650; color: var(--brand); }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary .chev { color: var(--brand); width: 18px; height: 18px; }
.law { margin-top: 12px; }
.law .ref { font-size: 13px; font-weight: 700; }
.law .plain { font-size: 14px; margin: 2px 0 8px; }
.law a { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; }
.law a .icon { width: 14px; height: 14px; }
.rows li { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; font-size: 15px; }
.rows li + li { border-top: 1px solid var(--line); }
.rows .icon { width: 18px; height: 18px; margin-top: 2px; color: var(--ok); }
.rows .icon svg { stroke-width: 2.4; }
.notice { display: flex; gap: 10px; border-radius: var(--r-md); padding: 12px 14px; background: var(--sunken); font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.notice .icon { width: 18px; height: 18px; margin-top: 1px; color: var(--faint); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 15px; }

/* Bosqichlar */
.timeline li { position: relative; display: flex; gap: 12px; padding-bottom: 16px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline li.done::before { background: var(--ok); }
.timeline .mark { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line-strong); z-index: 1; }
.timeline li.done .mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.timeline li.next .mark { border-color: var(--warn); }
.timeline li.next .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.timeline .mark .icon { width: 13px; height: 13px; }
.timeline .mark .icon svg { stroke-width: 3; }
.timeline b { display: block; font-size: 15px; line-height: 1.5; }
.timeline span { font-size: 13px; color: var(--muted); }
.timeline li:not(.done):not(.next) b { color: var(--muted); font-weight: 500; }

/* Pastki menyu */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr); height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 6px 8px env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--faint); }
.tab .pill { width: 52px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.tab .icon { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--brand); }
.tab[aria-selected="true"] .pill { background: var(--brand-soft); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 6; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <header class="top">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 3 6 9.500v12.600c0 11 7.400 19.400 18 22.900 10.600-3.500 18-11.900 18-22.900V9.500z" fill="var(--brand)"/>
      <rect x="15" y="13" width="18" height="22" rx="3" fill="var(--on-brand)"/>
      <path d="M19 19h10M19 23.500h6" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <path d="m19.500 29 3.200 3.200 6.300-6.700" fill="none" stroke="var(--brand)" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-name">Ishonchli Shartnoma</div>
    <div class="spacer"></div>
    <div class="badge" id="badge"></div>
  </header>

  <section id="view-check"></section>
  <section id="view-laws" hidden></section>
  <section id="view-upcoming" hidden></section>
</main>

<nav class="tabs" role="tablist" aria-label="Boʻlimlar">
  <button class="tab" role="tab" data-tab="check" aria-selected="true"><span class="pill" data-icon="shield"></span>Tekshiruv</button>
  <button class="tab" role="tab" data-tab="laws" aria-selected="false"><span class="pill" data-icon="book"></span>Qonunlar</button>
  <button class="tab" role="tab" data-tab="upcoming" aria-selected="false"><span class="pill" data-icon="clock"></span>Kutilmoqda</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  const initData = tg?.initData || "";
  const MAX_BYTES = 4 * 1024 * 1024;
  const MIN_CHARS = 800;
  const SEVERITY = { yuqori: "Yuqori xavf", orta: "Oʻrta xavf", past: "Past xavf" };
  const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
  /** "2026-11-10" -> "2026-yil 10-noyabr" */
  function formatDate(iso) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return match ? `${match[1]}-yil ${Number(match[3])}-${MONTHS[Number(match[2]) - 1]}` : iso;
  }

  // Statik, ishonchli SVG yoʻllari. Foydalanuvchi matni bu yerga hech qachon tushmaydi.
  const ICONS = {
    shield: '<path d="M12 3 5 5.500v5.300c0 4.600 3 8.200 7 9.700 4-1.500 7-5.100 7-9.700V5.500z"/><path d="m9.200 12 2 2 3.600-3.800"/>',
    book: '<path d="M5 4.500h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M9 9h5M9 12.500h5"/>',
    clock: '<circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/>',
    upload: '<path d="M12 15.500V4.500M7.500 8.500 12 4l4.500 4.500"/><path d="M5 15.500v2a2.500 2.500 0 0 0 2.500 2.500h9a2.500 2.500 0 0 0 2.500-2.500v-2"/>',
    file: '<path d="M7 3.500h6.500L18 8v10.500a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M13.500 3.500V8H18M8.500 12.500h7M8.500 16h5"/>',
    text: '<path d="M5 6.500h14M5 11h14M5 15.500h9"/>',
    x: '<path d="m6.500 6.500 11 11M17.500 6.500l-11 11"/>',
    check: '<path d="m5 12.500 4.500 4.500L19 7.500"/>',
    alert: '<path d="M12 4.500 3.500 19h17z"/><path d="M12 10v4M12 16.700v.1"/>',

          h("div", { class: "stack" },
            doc.provisions.map((p) => h("details", { class: "item reading" },
              h("summary", {}, h("span", { class: "head" }, h("span", { class: "label", style: "color:var(--brand)" }, p.ref), h("div", { class: "name" }, p.plain)), chevron()),
              h("div", { class: "body" }, h("blockquote", {}, p.text)))),
            h("div", { style: "padding:2px 4px" }, extLink(doc.url, "Toʻliq matn — lex.uz"))))),
        h("div", { class: "notice" }, icon("info"), h("span", {}, `${laws.note} Yangilangan: ${formatDate(laws.updated)}.`))));
      views.laws.dataset.ready = "1";
    } catch {
      mount(views.laws, h("div", { class: "alert" }, icon("alert"), h("span", {}, "Qonunlarni yuklab boʻlmadi. Qayta urinib koʻring.")));
    }
  }

  // ---------- Kutilayotgan qonunlar ----------
  async function renderUpcoming() {
    if (views.upcoming.dataset.ready) return;
    mount(views.upcoming, h("div", { class: "card progress" }, h("div", { class: "bar" }, h("i", {}))));
    try {
      const laws = await loadLaws();
      const nodes = [h("div", { class: "hero" }, h("h1", {}, "Kutilayotgan qonunlar"),
        h("p", {}, "Hali kuchga kirmagan, lekin uy xaridorlariga taʼsir qiladigan oʻzgarishlar."))];
      for (const law of laws.upcoming) {
        const next = law.stages.findIndex((stage) => !stage.done);
        const groups = { imkoniyat: law.provisions.filter((p) => p.kind === "imkoniyat"), xavf: law.provisions.filter((p) => p.kind === "xavf") };
        const provisionCard = (p) => h("details", { class: `item kind-${p.kind}` },
          h("summary", {}, h("span", { class: "sev" }, icon(p.kind === "imkoniyat" ? "plus" : "alert")), h("span", { class: "head" }, h("div", { class: "name" }, p.title)), chevron()),
          h("div", { class: "body" }, h("p", { style: "font-size:15px" }, p.text), p.source ? extLink(p.source, "Manba") : null));
        nodes.push(
          h("div", { class: "card stack" },
            h("div", { class: "eyebrow" }, "Qonun loyihasi"),
            h("h2", { style: "font-size:19px;line-height:1.25;letter-spacing:-.015em" }, law.title),
            h("ol", { class: "timeline", style: "margin-top:16px" }, law.stages.map((stage, n) => h("li", { class: stage.done ? "done" : n === next ? "next" : "" },
              h("span", { class: "mark" }, stage.done ? icon("check") : null),
              h("div", {}, h("b", {}, stage.name), h("span", {}, stage.done ? (formatDate(stage.date) || "Bajarildi") : n === next ? "Kutilmoqda" : "Navbatda")))))),
          h("div", {}, h("div", { class: "section-head" }, h("h2", {}, "Xaridor uchun imkoniyatlar"), h("span", {}, `${groups.imkoniyat.length} ta`)), h("div", { class: "stack" }, groups.imkoniyat.map(provisionCard))),
          h("div", {}, h("div", { class: "section-head" }, h("h2", {}, "Eʼtibor berish kerak"), h("span", {}, `${groups.xavf.length} ta`)), h("div", { class: "stack" }, groups.xavf.map(provisionCard))),
          h("div", { class: "notice" }, icon("info"), h("span", {}, law.source_note, " ", extLink(law.source, "Gazeta.uz"))));
      }
      mount(views.upcoming, h("div", { class: "stack-lg" }, nodes));
      views.upcoming.dataset.ready = "1";
    } catch {
      mount(views.upcoming, h("div", { class: "alert" }, icon("alert"), h("span", {}, "Maʼlumotni yuklab boʻlmadi. Qayta urinib koʻring.")));
    }
  }

  renderForm();
})();
</script>
</body>
</html>
